name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Приложение для iPhone и Mac (apple/, docs/mobile.md) — если в пуше есть оно само или сервер, с которым оно говорит.
  # Как в scripts/hooks/pre-push, только без сценариев XCUITest (им нужен стенд с Supabase в Docker — на macOS-машинах
  # GitHub его нет) и без снимков экранов (эталоны сняты на симуляторе iPhone 17 Pro / iOS 26.5 этого Mac — как эталоны
  # e2e, которые на Linux тоже не сравниваются): логика пакета, значки, сборка под iPhone и Mac. Минуты macOS дорогие
  # (×10), поэтому без правок apple/ и сервера задача сразу заканчивается.
  apple:
    if: github.event_name == 'workflow_dispatch' || vars.LOCAL_DEPLOYED_SHA != github.sha
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Есть ли правки apple/ или сервера
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || sh scripts/apple-changed.sh "${{ github.event.before }}" "${{ github.sha }}"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "apple/ и сервер не менялись — проверка iOS/Mac пропущена"
          fi
      - if: steps.changed.outputs.run == 'yes'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.run == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.changed.outputs.run == 'yes'
        run: pnpm install --frozen-lockfile && brew install xcodegen xcbeautify
      # iOS 26 SDK и Swift 6.2 — Xcode 26.5 (есть на образе macos-26, по умолчанию там 26.4.1).
      - if: steps.changed.outputs.run == 'yes'
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - if: steps.changed.outputs.run == 'yes'
        name: LifeCommitKit — swift test
        run: swift test --package-path apple/Kit
      - if: steps.changed.outputs.run == 'yes'
        name: Значки совпадают с мини-аппом
        run: node apple/scripts/icons.mjs --check
      - if: steps.changed.outputs.run == 'yes'
        name: Сборка под iPhone и Mac
        working-directory: apple
        run: |
          set -o pipefail
          xcodegen generate --quiet
          xcodebuild build -project LifeCommit.xcodeproj -scheme LifeCommit -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO | xcbeautify --quieter
          xcodebuild build -project LifeCommit.xcodeproj -scheme LifeCommit -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO | xcbeautify --quieter

  # Приложение для Android (android/, docs/mobile.md) — если в пуше есть оно само или сервер, с которым оно говорит.
  # Как в scripts/hooks/pre-push, только без сверки снимков экранов: эталоны сняты Robolectric на Mac, на Linux шрифты
  # рисуются иначе (как с эталонами e2e). Логика core, сценарии на Robolectric, значки, сборка APK.
  android:
    if: github.event_name == 'workflow_dispatch' || vars.LOCAL_DEPLOYED_SHA != github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Есть ли правки android/ или сервера
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || sh scripts/android-changed.sh "${{ github.event.before }}" "${{ github.sha }}"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "android/ и сервер не менялись — проверка Android пропущена"
          fi
      - if: steps.changed.outputs.run == 'yes'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.run == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.changed.outputs.run == 'yes'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - if: steps.changed.outputs.run == 'yes'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.run == 'yes'
        name: Значки совпадают с мини-аппом
        run: node android/scripts/icons.mjs --check
      - if: steps.changed.outputs.run == 'yes'
        name: Тесты core и app, сборка APK
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --console=plain

  deploy:
    # Пуш с машины, где включён scripts/hooks/pre-push, уже задеплоен оттуда — задачу пропускаем
    # (пропущенная задача не тратит минуты). Ручной запуск деплоит всегда.
    if: github.event_name == 'workflow_dispatch' || vars.LOCAL_DEPLOYED_SHA != github.sha
    needs: [apple, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Та же проверка, что в scripts/hooks/pre-push (решение владелицы 03.10.2026: пуш из облака
      # деплоится, только если всё зелёное): локальная Supabase, тесты сервера и фронта, сквозные.
      - run: pnpm db:start
      - name: .dev.vars для локального Worker (токен бота ненастоящий — в Telegram тесты не пишут)
        run: |
          eval "$(pnpm exec supabase status -o env)"
          cat > .dev.vars <<EOF
          TELEGRAM_BOT_TOKEN=7000000001:CI-TOKEN
          SUPABASE_URL=$API_URL
          SUPABASE_SECRET_KEY=$SECRET_KEY
          TELEGRAM_WEBHOOK_SECRET=ci-webhook-secret
          DEV_AUTH_BYPASS=1
          APP_URL=http://localhost:5173
          CALENDAR_KEY=$(openssl rand -base64 32)
          GOOGLE_CLIENT_SECRET=ci-google-secret
          EOF
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm typecheck
      # правила хуков React и потерянные промисы (.oxlintrc.json)
      - run: pnpm lint
      # тесты vitest и порог покрытия (vitest.config.ts → thresholds)
      - run: pnpm coverage
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - run: pnpm build
      # Секреты Worker'а (токен бота, ключ Supabase) живут в Cloudflare и деплоем не затрагиваются.
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Прод сразу после деплоя — как в scripts/hooks/pre-push: главная и её скрипт той самой сборки, API без подписи — 401,
      # вебхук без секрета — 403 (только чтение). Не прошло — откат Worker'а на предыдущую версию, задача красная.
      - name: Проверка прода после деплоя (откат при провале)
        run: |
          if ! node scripts/postdeploy-check.mjs; then
            echo "Прод после деплоя отвечает не так — откатываю Worker на предыдущую версию"
            pnpm exec wrangler rollback --yes --message "actions: postdeploy check failed for ${{ github.sha }}" || echo "Откат НЕ прошёл — откатить вручную: pnpm exec wrangler rollback"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
